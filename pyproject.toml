[project]
name = "jobspipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "httpx",
  "PyYAML",
  "sqlmodel",
  "SQLAlchemy",
  "anthropic>=0.120.2",
  "python-dotenv>=1.2.2",
  "beautifulsoup4>=4.15.0",
  "fastapi>=0.141.1",
  "uvicorn>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobspipeline"]
